name: update-wpt

# Bumps the sparse WPT submodule and refreshes expectation.json, then opens a PR.
# Merge is still manual so expectation drift can be reviewed.
#
# Two jobs on purpose: the WPT run (untrusted upstream scripts) only gets a
# read-only token; write credentials are limited to the PR job.

on:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  NODE_NO_WARNINGS: 1
  CI: true

jobs:
  refresh:
    name: sync WPT + refresh expectations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Install system deps
        run:
          sudo apt update && sudo apt install -y libcurl4-openssl-dev libssl-dev python3
          python3-venv

      - name: Setup env
        uses: the-guild-org/shared-config/setup@v1
        with:
          install-command: bash scripts/ci-npm-install.sh
          node-version-file: .node-version

      - name: Sync WPT submodule (sparse)
        run: npm run test:wpt:sync

      - name: Build
        run: npm run build

      - name: Configure hosts file for WPT
        run: |
          cd test/web-platform-tests/wpt
          python3 wpt make-hosts-file | sudo tee -a /etc/hosts

      - name: Setup WPT
        run: npm run test:wpt:setup

      - name: Refresh expectation.json
        env:
          # Refresh baseline without failing on success-bit drift; real crashes still fail the step.
          WPT_UPDATE_EXPECTATIONS: '1'
        run: node test/web-platform-tests/wpt-runner.mjs run /fetch /xhr/formdata /mimesniff

      - name: Package refresh artifacts
        run: |
          mkdir -p /tmp/wpt-refresh
          cp test/web-platform-tests/expectation.json /tmp/wpt-refresh/expectation.json
          git -C test/web-platform-tests/wpt rev-parse HEAD > /tmp/wpt-refresh/wpt-sha.txt

      - name: Upload refresh artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpt-refresh
          path: /tmp/wpt-refresh

  open-pr:
    name: open bump PR
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download refresh artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wpt-refresh
          path: /tmp/wpt-refresh

      - name: Apply refreshed WPT pin + expectations
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- test/web-platform-tests/wpt
          WPT_SHA="$(cat /tmp/wpt-refresh/wpt-sha.txt)"
          git -C test/web-platform-tests/wpt fetch --depth 1 origin "$WPT_SHA"
          git -C test/web-platform-tests/wpt checkout --detach "$WPT_SHA"
          # Re-apply sparse so the working tree matches local/CI layout
          mapfile -t PATHS < <(grep -vE '^\s*(#|$)' test/web-platform-tests/sparse-paths.txt)
          git -C test/web-platform-tests/wpt sparse-checkout init --cone
          git -C test/web-platform-tests/wpt sparse-checkout set "${PATHS[@]}"
          cp /tmp/wpt-refresh/expectation.json test/web-platform-tests/expectation.json
          # Stage submodule gitlink
          git add test/web-platform-tests/wpt test/web-platform-tests/expectation.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'test: bump WPT submodule and expectations'
          branch: chore/update-wpt
          delete-branch: true
          title: 'test: bump WPT submodule and expectations'
          body: |
            Automated weekly WPT bump.

            - Updates `test/web-platform-tests/wpt` (sparse submodule)
            - Regenerates `test/web-platform-tests/expectation.json`

            Review success-bit drift carefully before merge. Local equivalent:

            ```bash
            npm run test:wpt:sync
            npm run test:wpt
            ```
          add-paths: |
            test/web-platform-tests/wpt
            test/web-platform-tests/expectation.json
