name: cleanup-actions-storage

# Keep the default-branch Actions cache; drop PR/branch copies that otherwise
# re-fill the 10GB repo cache quota (setup-node npm + Puppeteer Chrome).

on:
  schedule:
    # Weekly Monday 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune-caches:
    name: prune non-default-branch caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches not on master
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepRef = 'refs/heads/master';
            let deleted = 0;
            let kept = 0;
            let page = 1;
            for (;;) {
              const { data } = await github.rest.actions.getActionsCacheList({
                owner,
                repo,
                per_page: 100,
                page,
              });
              const caches = data.actions_caches || [];
              if (caches.length === 0) break;
              for (const cache of caches) {
                if (cache.ref === keepRef) {
                  kept++;
                  continue;
                }
                await github.rest.actions.deleteActionsCacheById({
                  owner,
                  repo,
                  cache_id: cache.id,
                });
                deleted++;
                core.info(`Deleted cache ${cache.id} (${cache.key}) ref=${cache.ref}`);
              }
              if (caches.length < 100) break;
              page++;
            }
            core.info(`Done. deleted=${deleted} kept=${kept}`);
